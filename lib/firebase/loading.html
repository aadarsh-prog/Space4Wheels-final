<!DOCTYPE html> <html lang="en"> <head>   <meta charset="UTF-8" />   <meta name="viewport" content="width=device-width, initial-scale=1.0"/>   <title>Loading - ParkConnect</title>   <style>     body {       margin: 0;       background: #f4f7fc;       display: flex;       align-items: center;       justify-content: center;       height: 100vh;       font-family: 'Inter', sans-serif;     }      .loader-container {       position: relative;       width: 400px;       height: 200px;     }      .road {       position: absolute;       bottom: 40px;       width: 100%;       height: 50px;       background: #ddd;       border-radius: 10px;     }      .parking-spots {       position: absolute;       top: 0;       display: flex;       justify-content: space-between;       width: 100%;       padding: 0 10px;     }      .spot {       width: 60px;       height: 100px;       background: #ccc;       border-radius: 6px;       position: relative;       transition: background 0.3s;     }      .spot.occupied {       background: #e74c3c;     }      .spot.available {       background: #2ecc71;       box-shadow: 0 0 10px #2ecc71;     }      .car {       position: absolute;       width: 60px;       height: 30px;       background: #3498db;       border-radius: 6px;       bottom: 45px;       animation: drive 6s infinite;     }      .car::before {       content: '';       position: absolute;       width: 10px;       height: 10px;       background: #333;       border-radius: 50%;       bottom: -5px;       left: 10px;     }      .car::after {       content: '';       position: absolute;       width: 10px;       height: 10px;       background: #333;       border-radius: 50%;       bottom: -5px;       right: 10px;     }      @keyframes drive {       0% { left: -70px; }       30% { left: 120px; }       50% { left: 120px; bottom: 110px; }       70% { left: 120px; bottom: 110px; }       100% { left: -70px; bottom: 45px; }     }      .lock {       position: absolute;       width: 20px;       height: 20px;       top: 5px;       right: 5px;       background: #34495e;       color: #fff;       font-size: 12px;       display: flex;       align-items: center;       justify-content: center;       border-radius: 50%;       opacity: 0;       animation: lockAppear 6s infinite;     }      @keyframes lockAppear {       0%, 49% { opacity: 0; }       50%, 70% { opacity: 1; }       100% { opacity: 0; }     }   </style> </head> <body>   <div class="loader-container">     <div class="parking-spots">       <div class="spot occupied"></div>       <div class="spot occupied"></div>       <div class="spot available">         <div class="lock">🔒</div>       </div>       <div class="spot occupied"></div>     </div>     <div class="road"></div>     <div class="car"></div>   </div> </body> </html>
